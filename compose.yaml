# Works as a TrueNAS custom app (Apps > Discover Apps > three dots > Install via YAML) and with plain "docker compose up -d".
# Change POOL/audiobooks to your own folder first.
services:
  audiobook-maker:
    image: ghcr.io/healta/audiobook-maker:latest
    container_name: audiobook-maker
    restart: unless-stopped
    user: "568:568"                 # TrueNAS "apps" user; it needs write access to the folder below
    environment:
      TZ: Etc/UTC
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "30480:8080"                # dashboard: http://your-server:30480 (anyone on your network can read it; it cannot change anything)
    volumes:
      - /mnt/POOL/audiobooks:/data  # holds input, in-progress, output and config
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    # GPU. Without a working NVIDIA driver on the host, delete this "deploy" part: the CPU is used instead.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# adds a "Web UI" button in TrueNAS; ignored elsewhere
x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 30480
    path: /
