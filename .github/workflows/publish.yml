name: Publish image

# Every change to the program on "main" is tested, built, tried out on a tiny book and only then published as :latest.
# Each published image also keeps a tag of its own (sha-...), to go back to. A git tag such as v1.2.0 also publishes that version.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "Dockerfile", ".dockerignore", "requirements*.txt", "fetch_models.py", "models.sha256", ".github/workflows/publish.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install lxml PyYAML numpy
      - run: python -m unittest discover -s tests

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          # Uploaded without a tag first, so nobody gets it before it has been tried out.
          # TrueNAS's update check asks for Docker manifests, not OCI ones, hence oci-mediatypes=false and no provenance.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false
          provenance: false
          sbom: false
          # unchanged layers are taken from the published image
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:latest
          cache-to: type=inline
      - name: Narrate a tiny book with the new image
        run: bash tests/smoke.sh "$IMAGE"
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
      - name: Publish it
        run: for t in $TAGS; do docker buildx imagetools create --prefer-index=false -t "$t" "$IMAGE"; done
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
